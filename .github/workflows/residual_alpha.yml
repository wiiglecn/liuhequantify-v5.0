name: V5.8.3 Residual Alpha Discovery
on:
  push:
    branches: [dev]
    paths:
      - core/residual_alpha.py
      - v583_residual_alpha_run.py
      - tests/test_v583_residual_alpha.py
      - docs/V5.8.3_RESIDUAL_ALPHA.md
      - macau_history.json
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Unit tests
        run: python -m unittest tests/test_v583_residual_alpha.py -v
      - name: Run V5.8.3 historical residual-alpha research
        run: python v583_residual_alpha_run.py --input macau_history.json --output-dir reports/v5.8.3 --horizons 60,120 --residual-lambdas 0.10,0.20,0.30 --bootstrap-rounds 200
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: v5.8-3-residual-alpha
          path: reports/v5.8.3/
