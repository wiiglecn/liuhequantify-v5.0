name: Repository Integrity
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile changed K-policy modules
        if: ${{ hashFiles('core/live_k_policy.py') != '' }}
        run: python -m py_compile core/live_k_policy.py core/k_specific_policy.py core/pair_signal.py dimensions.py special_pool.py tools/compare_live_k_policy.py
      - name: Run K-policy regression tests
        if: ${{ hashFiles('tests/test_live_k_policy.py') != '' }}
        run: python -m unittest discover -s tests -p "test_live_k_policy.py" -v
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run historical K-policy OOS comparison
        if: ${{ hashFiles('tools/compare_live_k_policy.py') != '' }}
        run: python -X utf8 tools/compare_live_k_policy.py --backtest-n 30
      - name: Upload OOS comparison report
        if: ${{ always() && hashFiles('tools/compare_live_k_policy.py') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: k-policy-oos-comparison
          path: reports/k_policy_oos_comparison.json
          if-no-files-found: warn
      - name: Filename and stale-reference checks
        run: python tools/repository_integrity.py
