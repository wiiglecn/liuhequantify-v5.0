name: Repository Integrity
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile changed K-policy modules
        run: python -m py_compile core/live_k_policy.py core/k_specific_policy.py core/pair_signal.py dimensions.py special_pool.py
      - name: Run K-policy regression tests
        run: python -m unittest discover -s tests -p "test_live_k_policy.py" -v
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m pytest -q
      - name: Filename and stale-reference checks
        run: python tools/repository_integrity.py
