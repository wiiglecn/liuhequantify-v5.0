name: Repository Integrity
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scikit-learn
      - name: Filename and stale-reference checks
        run: python tools/repository_integrity.py
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run K-policy multi-window OOS audit
        run: python tools/multi_window_oos_audit.py --windows 120,180,300 --output reports/v585_multi_window_oos.json
      - name: Upload multi-window OOS report
        uses: actions/upload-artifact@v4
        with:
          name: v585-multi-window-oos-report
          path: reports/v585_multi_window_oos.json
          if-no-files-found: error
