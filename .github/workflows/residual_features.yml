name: V5.8.4 Residual Feature Discovery
on:
  push:
    branches: [dev]
    paths:
      - core/residual_features.py
      - core/residual_feature_discovery.py
      - residual_feature_run.py
      - tests/test_residual_features.py
      - docs/RESIDUAL_FEATURES.md
      - macau_history.json
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Unit tests
        run: python -m unittest tests/test_residual_features.py -v
      - name: Run V5.8.4 historical feature discovery
        run: python residual_feature_run.py --input macau_history.json --output-dir reports/v5.8.4
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: v5.8-4-residual-features
          path: reports/v5.8.4/
      - name: Unit tests V5.8.4.1 statistical hardening
        run: python -m unittest tests/test_statistical_hardening.py -v
      - name: Run V5.8.4.1 full historical statistical hardening
        run: python statistical_hardening_run.py --input macau_history.json --output-dir reports/v5.8.4.1
      - name: Upload V5.8.4.1 research report
        uses: actions/upload-artifact@v4
        with:
          name: v5.8-4-1-statistical-hardening
          path: reports/v5.8.4.1/
