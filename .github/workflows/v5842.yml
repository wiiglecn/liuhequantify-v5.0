name: V5.8.4.2 Rolling Window OOS Audit
on:
  push:
    branches: [dev]
    paths:
      - zodiac_ensemble.py
      - wide_ensemble.py
      - v5842_window_audit.py
      - macau_history.json
      - dimensions.py
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Rolling window OOS audit
        run: python v5842_window_audit.py --input macau_history.json --output-dir reports/v5.8.4.2
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v5.8-4-2-window-audit
          path: reports/v5.8.4.2/
