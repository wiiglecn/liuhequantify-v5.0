name: V5.5.1 Real Historical Signal Discovery

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - core/signal_discovery.py
      - signal_discovery_run.py
      - tests/test_signal_discovery.py
      - macau_history.json

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run V5.5.1
        run: python signal_discovery_run.py --input macau_history.json --output-dir reports/v5.5.1
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: v5.5.1-signal-discovery
          path: reports/v5.5.1/
