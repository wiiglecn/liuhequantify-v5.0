name: V5.0 Baseline Historical Benchmark
on:
  push:
    branches: [dev]
    paths:
      - macau_predictor.py
      - macau_history.json
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ff8b96bdd9776e6f481587bb040de3b83c6fde3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run V5.0 baseline
        run: python macau_predictor.py --backtest 929
