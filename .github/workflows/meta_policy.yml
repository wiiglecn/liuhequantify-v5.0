name: V5.7 Regime Signal Horizon Meta Policy
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - core/meta_policy.py
      - core/regime_detection.py
      - core/signal_metrics.py
      - meta_policy_run.py
      - tests/test_meta_policy.py
      - macau_history.json
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Unit tests
        run: python -m unittest tests/test_meta_policy.py -v
      - name: Run V5.7 historical research
        run: python meta_policy_run.py --input macau_history.json --output-dir reports/v5.7
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: v5.7-regime-signal-horizon
          path: reports/v5.7/
